name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check src tests

      - name: black --check
        run: black --check src tests

      - name: mypy
        run: mypy --ignore-missing-imports src/*.py

      - name: pytest (with coverage gate)
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=95

      - name: Full pipeline smoke run
        run: |
          python src/create_db.py --train data/events_train.csv --candidates data/events_candidates.csv --db /tmp/ci.db
          python src/train_regression.py --db /tmp/ci.db --sql src/queries.sql --outdir /tmp/ci-outputs
          python src/score_new_days.py --db /tmp/ci.db --sql src/queries.sql --model /tmp/ci-outputs/model.joblib --outdir /tmp/ci-outputs
